<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore Android Multi-Device - Raspberry Pi 5</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .device-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .device-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .status-indicator {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .status-online {
            background: #2ecc71;
            color: white;
        }

        .status-offline {
            background: #e74c3c;
            color: white;
        }

        .device-info {
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #ecf0f1;
        }

        .info-label {
            font-weight: 600;
            color: #7f8c8d;
        }

        .info-value {
            color: #2c3e50;
            font-family: monospace;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .automation-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .automation-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .automation-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .log-panel {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-info {
            color: #3498db;
        }

        .log-success {
            color: #2ecc71;
        }

        .log-warning {
            color: #f39c12;
        }

        .log-error {
            color: #e74c3c;
        }

        .screenshot-container {
            text-align: center;
            margin-top: 20px;
        }

        .screenshot {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .devices-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .automation-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-mobile-alt"></i> Simulatore Android Multi-Device</h1>
            <p>Controllo centralizzato per 3 dispositivi Android su Raspberry Pi 5</p>
        </div>

        <div class="devices-grid" id="devicesGrid">
            <!-- I dispositivi verranno caricati dinamicamente -->
        </div>

        <div class="automation-panel">
            <div class="automation-title">
                <i class="fas fa-robot"></i> Pannello Automazione
            </div>
            
            <div class="automation-controls">
                <div class="form-group">
                    <label for="deviceSelect">Dispositivo:</label>
                    <select id="deviceSelect">
                        <option value="1">Android 1</option>
                        <option value="2">Android 2</option>
                        <option value="3">Android 3</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="scriptSelect">Script:</label>
                    <select id="scriptSelect">
                        <option value="basic_automation">Automazione Base</option>
                        <option value="app_testing">Test Applicazioni</option>
                        <option value="performance_test">Test Performance</option>
                        <option value="custom">Script Personalizzato</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <button class="btn btn-success" onclick="startAutomation()">
                        <i class="fas fa-play"></i> Avvia Automazione
                    </button>
                </div>
                
                <div class="form-group">
                    <button class="btn btn-danger" onclick="stopAutomation()">
                        <i class="fas fa-stop"></i> Ferma Automazione
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="customScript">Script Personalizzato:</label>
                <textarea id="customScript" rows="4" placeholder="Inserisci il tuo script di automazione qui..."></textarea>
            </div>
            
            <div class="log-panel" id="logPanel">
                <div class="log-entry log-info">Sistema pronto. Seleziona un dispositivo e avvia l'automazione.</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Inizializzazione WebSocket
        const socket = io();
        
        // Stato globale
        let devices = {};
        let automationRunning = false;

        // Elementi DOM
        const devicesGrid = document.getElementById('devicesGrid');
        const logPanel = document.getElementById('logPanel');

        // Funzione per aggiungere log
        function addLog(message, type = 'info') {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logPanel.appendChild(logEntry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // Funzione per creare card dispositivo
        function createDeviceCard(deviceKey, device) {
            return `
                <div class="device-card">
                    <div class="device-header">
                        <div class="device-title">${device.name}</div>
                        <div class="status-indicator status-${device.status}">
                            ${device.status === 'online' ? 'ONLINE' : 'OFFLINE'}
                        </div>
                    </div>
                    
                    <div class="device-info">
                        <div class="info-item">
                            <span class="info-label">ADB Porta:</span>
                            <span class="info-value">${device.adbPort}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Web Porta:</span>
                            <span class="info-value">${device.webPort}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">VNC Porta:</span>
                            <span class="info-value">${device.vncPort}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">IP:</span>
                            <span class="info-value">${device.ip}</span>
                        </div>
                    </div>
                    
                    <div class="controls">
                        <button class="btn btn-primary" onclick="takeScreenshot(${device.id})" ${device.status !== 'online' ? 'disabled' : ''}>
                            <i class="fas fa-camera"></i> Screenshot
                        </button>
                        <button class="btn btn-success" onclick="tapScreen(${device.id})" ${device.status !== 'online' ? 'disabled' : ''}>
                            <i class="fas fa-hand-pointer"></i> Tap
                        </button>
                        <button class="btn btn-warning" onclick="swipeScreen(${device.id})" ${device.status !== 'online' ? 'disabled' : ''}>
                            <i class="fas fa-arrows-alt"></i> Swipe
                        </button>
                        <button class="btn btn-primary" onclick="inputText(${device.id})" ${device.status !== 'online' ? 'disabled' : ''}>
                            <i class="fas fa-keyboard"></i> Testo
                        </button>
                    </div>
                    
                    <div class="screenshot-container" id="screenshot${device.id}">
                        <!-- Screenshot verrà mostrato qui -->
                    </div>
                </div>
            `;
        }

        // Funzione per aggiornare dispositivi
        function updateDevices(newDevices) {
            devices = newDevices;
            devicesGrid.innerHTML = '';
            
            Object.entries(devices).forEach(([key, device]) => {
                devicesGrid.innerHTML += createDeviceCard(key, device);
            });
        }

        // Funzioni di controllo dispositivi
        async function takeScreenshot(deviceId) {
            try {
                addLog(`Acquisizione screenshot per Android ${deviceId}...`, 'info');
                const response = await fetch(`/api/device/${deviceId}/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'screenshot' })
                });
                
                const result = await response.json();
                if (result.success) {
                    addLog(`Screenshot acquisito per Android ${deviceId}`, 'success');
                    // Mostra screenshot
                    const container = document.getElementById(`screenshot${deviceId}`);
                    container.innerHTML = `<img src="${result.result}" class="screenshot" alt="Screenshot Android ${deviceId}">`;
                } else {
                    addLog(`Errore screenshot Android ${deviceId}: ${result.error}`, 'error');
                }
            } catch (error) {
                addLog(`Errore screenshot Android ${deviceId}: ${error.message}`, 'error');
            }
        }

        async function tapScreen(deviceId) {
            const x = prompt('X coordinate:', '500');
            const y = prompt('Y coordinate:', '500');
            
            if (x && y) {
                try {
                    addLog(`Tap su Android ${deviceId} alle coordinate (${x}, ${y})`, 'info');
                    const response = await fetch(`/api/device/${deviceId}/action`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'tap', 
                            params: { x: parseInt(x), y: parseInt(y) }
                        })
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        addLog(`Tap eseguito su Android ${deviceId}`, 'success');
                    } else {
                        addLog(`Errore tap Android ${deviceId}: ${result.error}`, 'error');
                    }
                } catch (error) {
                    addLog(`Errore tap Android ${deviceId}: ${error.message}`, 'error');
                }
            }
        }

        async function swipeScreen(deviceId) {
            const x1 = prompt('X1 coordinate:', '100');
            const y1 = prompt('Y1 coordinate:', '500');
            const x2 = prompt('X2 coordinate:', '900');
            const y2 = prompt('Y2 coordinate:', '500');
            
            if (x1 && y1 && x2 && y2) {
                try {
                    addLog(`Swipe su Android ${deviceId} da (${x1}, ${y1}) a (${x2}, ${y2})`, 'info');
                    const response = await fetch(`/api/device/${deviceId}/action`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'swipe', 
                            params: { 
                                x1: parseInt(x1), 
                                y1: parseInt(y1), 
                                x2: parseInt(x2), 
                                y2: parseInt(y2),
                                duration: 300
                            }
                        })
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        addLog(`Swipe eseguito su Android ${deviceId}`, 'success');
                    } else {
                        addLog(`Errore swipe Android ${deviceId}: ${result.error}`, 'error');
                    }
                } catch (error) {
                    addLog(`Errore swipe Android ${deviceId}: ${error.message}`, 'error');
                }
            }
        }

        async function inputText(deviceId) {
            const text = prompt('Testo da inserire:');
            
            if (text) {
                try {
                    addLog(`Inserimento testo su Android ${deviceId}: "${text}"`, 'info');
                    const response = await fetch(`/api/device/${deviceId}/action`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'text', 
                            params: { text: text }
                        })
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        addLog(`Testo inserito su Android ${deviceId}`, 'success');
                    } else {
                        addLog(`Errore inserimento testo Android ${deviceId}: ${result.error}`, 'error');
                    }
                } catch (error) {
                    addLog(`Errore inserimento testo Android ${deviceId}: ${error.message}`, 'error');
                }
            }
        }

        // Funzioni automazione
        async function startAutomation() {
            const deviceId = document.getElementById('deviceSelect').value;
            const script = document.getElementById('scriptSelect').value;
            const customScript = document.getElementById('customScript').value;
            
            if (script === 'custom' && !customScript.trim()) {
                addLog('Inserisci uno script personalizzato', 'warning');
                return;
            }
            
            try {
                addLog(`Avvio automazione su Android ${deviceId} con script ${script}`, 'info');
                automationRunning = true;
                
                const response = await fetch('/api/automation/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        deviceId: parseInt(deviceId), 
                        script: script === 'custom' ? customScript : script
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    addLog(`Automazione avviata su Android ${deviceId}`, 'success');
                } else {
                    addLog(`Errore avvio automazione: ${result.error}`, 'error');
                    automationRunning = false;
                }
            } catch (error) {
                addLog(`Errore avvio automazione: ${error.message}`, 'error');
                automationRunning = false;
            }
        }

        async function stopAutomation() {
            try {
                addLog('Arresto automazione...', 'info');
                automationRunning = false;
                addLog('Automazione fermata', 'success');
            } catch (error) {
                addLog(`Errore arresto automazione: ${error.message}`, 'error');
            }
        }

        // Eventi WebSocket
        socket.on('devicesStatus', updateDevices);
        socket.on('deviceAction', (data) => {
            addLog(`Azione ${data.action} eseguita su Android ${data.deviceId}`, 'success');
        });
        socket.on('automationStarted', (data) => {
            addLog(`Automazione ${data.script} avviata su Android ${data.deviceId}`, 'success');
        });

        // Caricamento iniziale
        addLog('Connessione al server...', 'info');
        fetch('/api/devices')
            .then(response => response.json())
            .then(updateDevices)
            .then(() => addLog('Sistema pronto!', 'success'))
            .catch(error => addLog(`Errore connessione: ${error.message}`, 'error'));
    </script>
</body>
</html>
